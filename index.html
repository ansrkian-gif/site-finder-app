<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Site Finder" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Site Finder</title>
  <script>
    (function () {
      var theme = "midnight";
      try { theme = localStorage.getItem("site-finder-theme") || "midnight"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
:root,
html[data-theme="midnight"] {
  --bg: #07111f;
  --bg-2: #0c1a2e;
  --card: #12233b;
  --card-2: #17304d;
  --line: rgba(245, 193, 108, 0.16);
  --text: #eef4ff;
  --muted: #93a4bf;
  --gold: #f5c16c;
  --gold-dim: #d4a45a;
  --maps: #ff8a3d;
  --maps-ink: #2b1404;
  --wa: #1fa855;
  --ok: #3ddc97;
  --ok-bg: rgba(61, 220, 151, 0.14);
  --warn: #ffb020;
  --warn-bg: rgba(255, 176, 32, 0.14);
  --glow: rgba(245, 193, 108, 0.16);
  --soft: rgba(255, 255, 255, 0.06);
  --map-overlay: rgba(7, 17, 31, 0.88);
  --btn-text: #ffffff;
  --toast-ink: #1a1408;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html[data-theme="sand"] {
  --bg: #f3eee4;
  --bg-2: #e8e0d0;
  --card: #fffaf1;
  --card-2: #e4d8c4;
  --line: rgba(120, 72, 24, 0.16);
  --text: #2a2118;
  --muted: #7a6b58;
  --gold: #b45309;
  --gold-dim: #9a3412;
  --maps: #ea580c;
  --maps-ink: #fff7ed;
  --wa: #128c7e;
  --ok: #166534;
  --ok-bg: rgba(22, 101, 52, 0.12);
  --warn: #9a3412;
  --warn-bg: rgba(154, 52, 18, 0.12);
  --glow: rgba(180, 83, 9, 0.12);
  --soft: rgba(42, 33, 24, 0.06);
  --map-overlay: rgba(255, 250, 241, 0.9);
  --btn-text: #2a2118;
  --toast-ink: #fff7ed;
}

html[data-theme="forest"] {
  --bg: #07140f;
  --bg-2: #0d2119;
  --card: #123024;
  --card-2: #184233;
  --line: rgba(143, 217, 168, 0.16);
  --text: #ecfdf3;
  --muted: #8fb9a4;
  --gold: #86efac;
  --gold-dim: #4ade80;
  --maps: #34d399;
  --maps-ink: #022c22;
  --wa: #16a34a;
  --ok: #4ade80;
  --ok-bg: rgba(74, 222, 128, 0.14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.14);
  --glow: rgba(74, 222, 128, 0.14);
  --soft: rgba(255, 255, 255, 0.06);
  --map-overlay: rgba(7, 20, 15, 0.88);
  --btn-text: #ffffff;
  --toast-ink: #022c22;
}

html[data-theme="ocean"] {
  --bg: #06141c;
  --bg-2: #0b2230;
  --card: #123044;
  --card-2: #16415c;
  --line: rgba(125, 211, 252, 0.16);
  --text: #eaf6ff;
  --muted: #8eb4c9;
  --gold: #7dd3fc;
  --gold-dim: #38bdf8;
  --maps: #38bdf8;
  --maps-ink: #082f49;
  --wa: #0d9488;
  --ok: #2dd4bf;
  --ok-bg: rgba(45, 212, 191, 0.14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.14);
  --glow: rgba(56, 189, 248, 0.16);
  --soft: rgba(255, 255, 255, 0.06);
  --map-overlay: rgba(6, 20, 28, 0.88);
  --btn-text: #ffffff;
  --toast-ink: #082f49;
}

html[data-theme="rose"] {
  --bg: #180910;
  --bg-2: #2a121c;
  --card: #3a1826;
  --card-2: #4c2033;
  --line: rgba(249, 168, 212, 0.16);
  --text: #fff1f5;
  --muted: #c9a0b0;
  --gold: #f9a8d4;
  --gold-dim: #f472b6;
  --maps: #fb7185;
  --maps-ink: #4c0519;
  --wa: #be185d;
  --ok: #86efac;
  --ok-bg: rgba(134, 239, 172, 0.14);
  --warn: #fbbf24;
  --warn-bg: rgba(251, 191, 36, 0.14);
  --glow: rgba(244, 114, 182, 0.16);
  --soft: rgba(255, 255, 255, 0.06);
  --map-overlay: rgba(24, 9, 16, 0.88);
  --btn-text: #ffffff;
  --toast-ink: #4c0519;
}

html[data-theme="mono"] {
  --bg: #0a0a0a;
  --bg-2: #171717;
  --card: #1c1c1c;
  --card-2: #2a2a2a;
  --line: rgba(245, 245, 244, 0.14);
  --text: #f5f5f4;
  --muted: #a8a29e;
  --gold: #fafaf9;
  --gold-dim: #d6d3d1;
  --maps: #e7e5e4;
  --maps-ink: #0c0a09;
  --wa: #292524;
  --ok: #d6d3d1;
  --ok-bg: rgba(214, 211, 209, 0.12);
  --warn: #a8a29e;
  --warn-bg: rgba(168, 162, 158, 0.14);
  --glow: rgba(250, 250, 249, 0.08);
  --soft: rgba(255, 255, 255, 0.06);
  --map-overlay: rgba(10, 10, 10, 0.88);
  --btn-text: #fafaf9;
  --toast-ink: #0c0a09;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: var(--bg);
}

body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background:
    radial-gradient(1200px 420px at 50% -80px, var(--glow), transparent 60%),
    var(--bg);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.app {
  max-width: 520px;
  min-height: 100dvh;
  margin: 0 auto;
  padding-bottom: calc(12px + var(--safe-bottom));
}

.top {
  padding: calc(12px + var(--safe-top)) 20px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--gold);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--gold);
  display: grid;
  place-items: center;
}

.theme-sheet {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.theme-sheet[hidden] {
  display: none;
}

.theme-sheet-inner {
  width: min(520px, 100%);
  background: var(--card);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(16px + var(--safe-bottom));
}

.theme-sheet h2 {
  font-size: 16px;
  margin-bottom: 12px;
}

.theme-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.theme-option {
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--text);
  border-radius: 14px;
  padding: 10px 8px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 650;
}

.theme-option.active {
  border-color: var(--gold);
  color: var(--gold);
}

.theme-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  margin: 0 auto 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.theme-option[data-theme-id="midnight"] .theme-dot { background: #f5c16c; }
.theme-option[data-theme-id="sand"] .theme-dot { background: #b45309; }
.theme-option[data-theme-id="forest"] .theme-dot { background: #86efac; }
.theme-option[data-theme-id="ocean"] .theme-dot { background: #7dd3fc; }
.theme-option[data-theme-id="rose"] .theme-dot { background: #f9a8d4; }
.theme-option[data-theme-id="mono"] .theme-dot { background: #fafaf9; }

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 2px;
}

.top h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
}

.count {
  font-size: 12px;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px;
  white-space: nowrap;
}

.search-wrap {
  padding: 10px 16px 0;
  position: sticky;
  top: 0;
  z-index: 5;
  background: linear-gradient(var(--bg) 70%, transparent);
}

.search-box {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 15px;
  color: var(--gold);
}

.search-box input {
  width: 100%;
  height: 50px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  padding: 0 48px 0 48px;
  font-size: 17px;
  color: var(--text);
  outline: none;
  font-family: inherit;
}

.search-box input::placeholder {
  color: var(--muted);
}

.search-box input:focus {
  border-color: var(--gold);
}

.clear {
  position: absolute;
  right: 8px;
  top: 8px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  font-size: 26px;
  line-height: 1;
  color: var(--muted);
}

main {
  padding: 10px 16px 0;
}

.hero-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 28px 20px 22px;
  text-align: center;
}

.hero-pin {
  margin-bottom: 8px;
  color: var(--gold);
}

.hero-card h2 {
  font-size: 22px;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}

.hint {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
}

.hint strong {
  color: var(--gold);
  font-weight: 650;
}

.list-label {
  margin: 22px 0 10px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.starter {
  justify-content: center;
  margin-top: 18px;
}

.chip {
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
}

.card,
.result,
.detail {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
}

.result {
  width: 100%;
  text-align: left;
  margin-bottom: 10px;
  cursor: pointer;
  padding: 14px 14px 14px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: inherit;
  font-family: inherit;
}

.result-mark {
  width: 8px;
  align-self: stretch;
  border-radius: 99px;
  background: var(--muted);
  flex: 0 0 8px;
}

.result-mark.on-air {
  background: var(--ok);
}

.result-body {
  flex: 1;
  min-width: 0;
}

.result-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}

.id {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.cand {
  color: var(--gold);
  font-size: 13px;
  font-weight: 650;
}

.meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
}

.addr-preview {
  margin-top: 6px;
  color: var(--text);
  opacity: 0.8;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chevron {
  color: var(--muted);
  flex: 0 0 auto;
}

.empty {
  padding: 36px 16px;
  text-align: center;
  color: var(--muted);
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 20px;
}

.empty strong {
  color: var(--gold);
}

.detail {
  overflow: hidden;
  animation: rise 0.28s ease;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.map-frame {
  display: block;
  position: relative;
  height: 112px;
  overflow: hidden;
  background: var(--bg-2);
}

.map-frame iframe {
  width: 100%;
  height: 152px;
  margin-top: -20px;
  border: 0;
  pointer-events: none;
  filter: saturate(0.85) contrast(1.05);
}

.map-open {
  position: absolute;
  right: 12px;
  bottom: 12px;
  background: var(--map-overlay);
  color: var(--text);
  font-size: 12px;
  font-weight: 650;
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
}

.detail-body {
  padding: 10px 14px 12px;
}

.detail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.detail-id {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: var(--gold);
}

.detail-cand {
  margin-top: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 8px;
}

.pill {
  font-size: 12px;
  font-weight: 650;
  border-radius: 999px;
  padding: 6px 10px;
}

.pill.on-air {
  background: var(--ok-bg);
  color: var(--ok);
}

.pill.other {
  background: var(--warn-bg);
  color: var(--warn);
}

.pill.neutral {
  background: var(--soft);
  color: var(--text);
}

.facts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 6px;
}

.fact {
  background: var(--bg-2);
  border-radius: 12px;
  padding: 8px 10px;
}

.fact.wide {
  grid-column: 1 / -1;
}

.fact dt {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}

.fact dd {
  font-size: 14px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.coords {
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 650;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.actions-secondary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 6px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  text-align: center;
  text-decoration: none;
  border: 0;
  border-radius: 14px;
  padding: 11px 10px;
  font-size: 13px;
  font-weight: 650;
  color: var(--btn-text);
  background: var(--card-2);
  font-family: inherit;
}

.btn.maps {
  background: var(--maps);
  color: var(--maps-ink);
}

.btn.whatsapp {
  background: var(--wa);
  color: #fff;
}

.btn.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  font-size: 11px;
  padding: 9px 6px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-bottom));
  transform: translateX(-50%);
  background: var(--gold);
  color: var(--toast-ink);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 650;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.toast.show {
  opacity: 1;
}

button, a.btn {
  -webkit-tap-highlight-color: transparent;
}

button:active, a.btn:active, .chip:active, .result:active {
  transform: scale(0.98);
}

input[type="search"]::-webkit-search-cancel-button {
  -webkit-appearance: none;
}

.mode-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 10px 16px 0;
  padding: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
}

.mode-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 10px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 650;
}

.mode-btn.active {
  background: var(--bg-2);
  color: var(--gold);
}

.route-wrap {
  padding: 10px 16px 0;
}

.route-wrap .hint {
  margin-top: 10px;
}

.route-stop {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.route-num {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--gold);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
}

.route-stop input {
  flex: 1;
  min-width: 0;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  padding: 0 12px;
  font-size: 16px;
  color: var(--text);
  outline: none;
  font-family: inherit;
}

.route-stop input:focus {
  border-color: var(--gold);
}

.route-stop input.bad {
  border-color: #fb7185;
}

.stop-remove {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
}

.route-tools {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 8px;
  margin-top: 4px;
}

.route-total {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 10px;
  text-align: center;
}

.route-total dt {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.route-total dd {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.04em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.route-hop {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 8px;
}

.route-hop .from-to {
  font-size: 15px;
  font-weight: 650;
}

.route-hop .km {
  color: var(--gold);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.route-hop .meta {
  grid-column: 1 / -1;
  margin-top: 0;
}

</style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <path fill="currentColor" d="M16 2a10 10 0 0 0-10 10c0 7.5 10 18 10 18s10-10.5 10-18A10 10 0 0 0 16 2zm0 13.5A3.5 3.5 0 1 1 16 8a3.5 3.5 0 0 1 0 7.5z"/>
          </svg>
        </span>
        <div>
          <p class="eyebrow">Field lookup</p>
          <h1>Site Finder</h1>
        </div>
      </div>
      <div class="top-actions">
        <p class="count" id="siteCount"></p>
        <button type="button" class="theme-btn" id="themeBtn" aria-label="Change theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>
          </svg>
        </button>
      </div>

const sites = Array.isArray(window.SITES) ? window.SITES : [];

const themeSheet = document.getElementById("themeSheet");
const themeGrid = document.getElementById("themeGrid");

const routeModeBtn = document.getElementById("routeModeBtn");
const searchForm = document.getElementById("searchForm");
const routeForm = document.getElementById("routeForm");
const routeStopsEl = document.getElementById("routeStops");
const routeState = document.getElementById("routeState");
const addStopBtn = document.getElementById("addStopBtn");
const MAX_STOPS = 10;
const RECENT_KEY = "site-finder-recent";
const THEME_KEY = "site-finder-theme";
const THEMES = [
  { id: "midnight", name: "Midnight" },
  { id: "sand", name: "Sand" },
  { id: "forest", name: "Forest" },
  { id: "ocean", name: "Ocean" },
  { id: "rose", name: "Rose" },
  { id: "mono", name: "Mono" }
];

siteCount.textContent = sites.length.toLocaleString() + " sites";

function normalize(value) {
  return String(value || "").trim().toUpperCase();
}

function mapsUrl(site) {
  return "https://www.google.com/maps/search/?api=1&query=" + site.lat + "," + site.lng;
}

function mapEmbedUrl(site) {
  const padLat = 0.006;
  const padLng = 0.008;
  return (
    "https://www.openstreetmap.org/export/embed.html?bbox=" +
    (site.lng - padLng) + "%2C" +
    (site.lat - padLat) + "%2C" +
    (site.lng + padLng) + "%2C" +
    (site.lat + padLat) +
    "&layer=mapnik&marker=" + site.lat + "%2C" + site.lng
  );
}

function shareMessage(site) {
  return [
    "Site " + site.id + " (" + site.cand + ")",
    "On air: " + (site.onAir || "Not recorded"),
    "Address: " + site.address,
    "Lat, long: " + site.lat + ", " + site.lng,
    "Map: " + mapsUrl(site)
  ].join("\n");
}

function whatsappUrl(site) {
  return "https://wa.me/?text=" + encodeURIComponent(shareMessage(site));
}

function statusClass(status) {
  return normalize(status) === "ON-AIR" ? "on-air" : "other";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function loadRecent() {
  try {
    const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
    return Array.isArray(raw) ? raw.slice(0, 8) : [];
  } catch {
    return [];
  }
}

function saveRecent(site) {
  const next = [site.id, ...loadRecent().filter((id) => id !== site.id)].slice(0, 8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(next));
  renderRecent();
}

function renderRecent() {
  const ids = loadRecent();
  if (!ids.length) {
    recentWrap.hidden = true;
    return;
  }
  recentWrap.hidden = false;
  recentList.innerHTML = ids
    .map((id) => `<button type="button" class="chip" data-q="${escapeHtml(id)}">${escapeHtml(id)}</button>`)
    .join("");
}

function searchSites(rawQuery) {
  const q = normalize(rawQuery);
  if (!q) return [];

  const exactId = [];
  const exactCand = [];
  const starts = [];
  const contains = [];

  for (const site of sites) {
    const id = normalize(site.id);
    const cand = normalize(site.cand);
    if (id === q) exactId.push(site);
    else if (cand === q) exactCand.push(site);
    else if (id.startsWith(q) || cand.startsWith(q)) starts.push(site);
    else if (id.includes(q) || cand.includes(q)) contains.push(site);
  }

  return exactId.concat(exactCand, starts, contains).slice(0, 40);
}

function findExactSite(raw) {
  const q = normalize(raw);
  if (!q) return null;
  return sites.find((site) => normalize(site.id) === q || normalize(site.cand) === q) || null;
}

function haversineKm(a, b) {
  const toRad = (deg) => (Number(deg) * Math.PI) / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const h =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(h)));
}

function formatDistance(km) {
  if (!Number.isFinite(km)) return "—";
  if (km < 1) return Math.round(km * 1000) + " m";
  return km.toFixed(2) + " km";
}

function directionsUrl(list) {
  const pts = list.map((site) => site.lat + "," + site.lng);
  const origin = pts[0];
  const destination = pts[pts.length - 1];
  let url =
    "https://www.google.com/maps/dir/?api=1&origin=" +
    origin +
    "&destination=" +
    destination;
  if (pts.length > 2) {
    url += "&waypoints=" + pts.slice(1, -1).join("%7C");
  }
  return url;
}

function routeShareMessage(found, hops, totalKm) {
  const lines = ["Site route"];
  hops.forEach((hop) => {
    lines.push(hop.from.id + " → " + hop.to.id + ": " + formatDistance(hop.km));
  });
  lines.push("Total: " + formatDistance(totalKm));
  lines.push("Map: " + directionsUrl(found));
  return lines.join("\n");
}

function showHome() {
  homeState.hidden = false;
  resultsState.hidden = true;
  detailState.hidden = true;
  routeState.hidden = true;
}

function showResults(items, query) {
  homeState.hidden = true;
  detailState.hidden = true;
  routeState.hidden = true;
  resultsState.hidden = false;

  if (!items.length) {
    resultsState.innerHTML =
      '<div class="empty">No site found for <strong>' +
      escapeHtml(query) +
      "</strong>. Try the numeric ID or the candidate ID.</div>";
    return;
  }

  resultsState.innerHTML =
    '<p class="list-label">' +
    items.length +
    " result" +
    (items.length === 1 ? "" : "s") +
    "</p>" +
    items
      .map(
        (site, index) =>
          '<button type="button" class="result" data-index="' +
          index +
          '">' +
          '<span class="result-mark ' +
          statusClass(site.status) +
          '"></span>' +
          '<span class="result-body">' +
          '<span class="result-top"><span class="id">' +
          escapeHtml(site.id) +
          '</span><span class="cand">' +
          escapeHtml(site.cand) +
          "</span></span>" +
          '<span class="meta">' +
          escapeHtml(site.status) +
          " · " +
          escapeHtml(site.onAir || "No on-air date") +
          "</span>" +
          '<span class="addr-preview">' +
          escapeHtml(site.address) +
          "</span></span>" +
          '<svg class="chevron" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 6l6 6-6 6"/></svg>' +
          "</button>"
      )
      .join("");

  resultsState.querySelectorAll(".result").forEach((btn, index) => {
    btn.addEventListener("click", () => openDetail(items[index], false));
  });
}

function openDetail(site, fromSearch) {
  saveRecent(site);
  homeState.hidden = true;
  resultsState.hidden = true;
  routeState.hidden = true;
  detailState.hidden = false;

  const onAir = site.onAir ? escapeHtml(site.onAir) : "Not recorded";
  const type = site.type ? escapeHtml(site.type) : "Unknown";

  detailState.innerHTML =
    '<article class="detail">' +
    '<a class="map-frame" target="_blank" rel="noopener" href="' +
    mapsUrl(site) +
    '">' +
    '<iframe title="Map preview" loading="lazy" src="' +
    mapEmbedUrl(site) +
    '"></iframe>' +
    '<span class="map-open">Open Google Maps</span></a>' +
    '<div class="detail-body">' +
    '<div class="detail-head">' +
    '<p class="detail-id">' +
    escapeHtml(site.id) +
    "</p>" +
    '<p class="detail-cand">' +
    escapeHtml(site.cand) +
    "</p></div>" +
    '<div class="pills">' +
    '<span class="pill ' +
    statusClass(site.status) +
    '">' +
    escapeHtml(site.status || "Unknown") +
    "</span>" +
    '<span class="pill neutral">' +
    type +
    "</span></div>" +
    '<div class="facts">' +
    '<div class="fact"><dt>On air date</dt><dd>' +
    onAir +
    "</dd></div>" +
    '<div class="fact"><dt>Site type</dt><dd>' +
    type +
    "</dd></div>" +
    '<div class="fact"><dt>Latitude</dt><dd class="coords">' +
    site.lat +
    "</dd></div>" +
    '<div class="fact"><dt>Longitude</dt><dd class="coords">' +
    site.lng +
    "</dd></div>" +
    '<div class="fact wide"><dt>Address</dt><dd>' +
    escapeHtml(site.address) +
    "</dd></div>" +
    "</div>" +
    '<div class="actions">' +
    '<a class="btn maps" target="_blank" rel="noopener" href="' +
    mapsUrl(site) +
    '">Google Maps</a>' +
    '<a class="btn whatsapp" target="_blank" rel="noopener" href="' +
    whatsappUrl(site) +
    '">WhatsApp</a>' +
    "</div>" +
    '<div class="actions-secondary">' +
    '<button type="button" class="btn ghost" id="copyShare">Copy share</button>' +
    '<button type="button" class="btn ghost" id="copyCoords">Copy coords</button>' +
    '<button type="button" class="btn ghost" id="addToRoute">Add to route</button>' +
    "</div></div></article>";

  document.getElementById("copyShare").addEventListener("click", () => {
    copyText(shareMessage(site), "Share text copied");
  });
  document.getElementById("copyCoords").addEventListener("click", () => {
    copyText(site.lat + ", " + site.lng, "Coordinates copied");
  });
  document.getElementById("addToRoute").addEventListener("click", () => {
    addSiteToRoute(site.id);
  });

  if (fromSearch) queryEl.blur();
}

function copyText(text, message) {
  const done = () => toast(message);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const area = document.createElement("textarea");
  area.value = text;
  document.body.appendChild(area);
  area.select();
  document.execCommand("copy");
  area.remove();
  done();
}

function toast(message) {
  let el = document.querySelector(".toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}

function parseRouteQuery(rawQuery) {
  const raw = String(rawQuery || "").trim();
  if (!raw) return [];
  if (/\bto\b/i.test(raw) || raw.includes(",") || raw.includes("→") || raw.includes(">")) {
    return raw
      .split(/\s*(?:to|,|→|>)+\s*/i)
      .map((part) => part.trim())
      .filter(Boolean);
  }
  return [];
}

function runSearch(rawQuery, autoOpen) {
  const q = String(rawQuery || "").trim();
  clearBtn.hidden = !q;
  if (!q) {
    showHome();
    return;
  }

  const routeIds = parseRouteQuery(q);
  if (routeIds.length >= 2) {
    setMode("route");
    fillRouteStops(routeIds);
    calculateRoute();
    return;
  }

  const items = searchSites(q);
  const exact = items.filter(
    (site) => normalize(site.id) === normalize(q) || normalize(site.cand) === normalize(q)
  );

  if (autoOpen && exact.length === 1) {
    queryEl.value = exact[0].id;
    openDetail(exact[0], true);
    return;
  }

  showResults(items, q);
}

function setMode(mode) {
  const isRoute = mode === "route";
  lookupModeBtn.classList.toggle("active", !isRoute);
  routeModeBtn.classList.toggle("active", isRoute);
  searchForm.hidden = isRoute;
  routeForm.hidden = !isRoute;
  if (isRoute) {
    if (!routeStopsEl.children.length) renderRouteStops(["", ""]);
    homeState.hidden = true;
    resultsState.hidden = true;
    detailState.hidden = true;
    if (routeState.innerHTML) routeState.hidden = false;
  } else if (queryEl.value.trim()) {
    runSearch(queryEl.value, false);
  } else {
    showHome();
  }
}

function renderRouteStops(values) {
  const list = values && values.length ? values.slice(0, MAX_STOPS) : ["", ""];
  while (list.length < 2) list.push("");
  routeStopsEl.innerHTML = list
    .map((value, index) => {
      return (
        '<div class="route-stop">' +
        '<span class="route-num">' +
        (index + 1) +
        "</span>" +
        '<input type="text" inputmode="text" enterkeyhint="next" spellcheck="false" autocapitalize="characters" placeholder="Site ' +
        (index + 1) +
        ' ID" value="' +
        escapeHtml(value) +
        '" />' +
        '<button type="button" class="stop-remove" data-remove="' +
        index +
        '" aria-label="Remove site"' +
        (list.length <= 2 ? " hidden" : "") +
        ">×</button>" +
        "</div>"
      );
    })
    .join("");
}

function routeInputs() {
  return Array.from(routeStopsEl.querySelectorAll("input"));
}

function fillRouteStops(ids) {
  renderRouteStops(ids);
}

function addSiteToRoute(siteId) {
  setMode("route");
  const values = routeInputs().map((input) => input.value.trim());
  const empty = values.findIndex((value) => !value);
  if (empty >= 0) values[empty] = siteId;
  else if (values.length < MAX_STOPS) values.push(siteId);
  else values[values.length - 1] = siteId;
  renderRouteStops(values);
  toast("Added " + siteId + " to route");
}

function calculateRoute() {
  const values = routeInputs().map((input) => input.value.trim());
  const found = [];
  let valid = true;

  routeInputs().forEach((input, index) => {
    const site = findExactSite(values[index]);
    input.classList.toggle("bad", !site);
    if (site) found.push(site);
    else valid = false;
  });

  if (values.filter(Boolean).length < 2) {
    toast("Enter at least two site IDs");
    return;
  }

  if (!valid) {
    toast("Fix the red site IDs");
    return;
  }

  const hops = [];
  let totalKm = 0;
  for (let i = 0; i < found.length - 1; i++) {
    const km = haversineKm(found[i], found[i + 1]);
    hops.push({ from: found[i], to: found[i + 1], km: km });
    totalKm += km;
  }

  homeState.hidden = true;
  resultsState.hidden = true;
  detailState.hidden = true;
  routeState.hidden = false;

  routeState.innerHTML =
    '<article class="route-total"><dt>Total distance</dt><dd>' +
    formatDistance(totalKm) +
    "</dd></article>" +
    hops
      .map(
        (hop, index) =>
          '<div class="route-hop">' +
          '<div class="from-to">' +
          (index + 1) +
          ". " +
          escapeHtml(hop.from.id) +
          " → " +
          escapeHtml(hop.to.id) +
          '</div><div class="km">' +
          formatDistance(hop.km) +
          '</div><p class="meta">' +
          escapeHtml(hop.from.cand) +
          " to " +
          escapeHtml(hop.to.cand) +
          "</p></div>"
      )
      .join("") +
    '<p class="meta" style="margin: 4px 2px 10px">Point-to-point distance.</p>' +
    '<div class="actions">' +
    '<a class="btn maps" target="_blank" rel="noopener" href="' +
    directionsUrl(found) +
    '">Google Maps</a>' +
    '<a class="btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/?text=' +
    encodeURIComponent(routeShareMessage(found, hops, totalKm)) +
    '">WhatsApp</a></div>' +
    '<div class="actions-secondary">' +
    '<button type="button" class="btn ghost" id="copyRoute">Copy distances</button></div>';

  document.getElementById("copyRoute").addEventListener("click", () => {
    copyText(routeShareMessage(found, hops, totalKm), "Route copied");
  });
}

queryEl.addEventListener("input", () => runSearch(queryEl.value, false));
document.getElementById("searchForm").addEventListener("submit", (event) => {
  event.preventDefault();
  runSearch(queryEl.value, true);
});
clearBtn.addEventListener("click", () => {
  queryEl.value = "";
  runSearch("", false);
  queryEl.focus();
});

function onChipClick(event) {
  const chip = event.target.closest("[data-q]");
  if (!chip) return;
  queryEl.value = chip.getAttribute("data-q");
  runSearch(queryEl.value, true);
}

recentList.addEventListener("click", onChipClick);
if (starterChips) starterChips.addEventListener("click", onChipClick);

lookupModeBtn.addEventListener("click", () => setMode("lookup"));
routeModeBtn.addEventListener("click", () => setMode("route"));
addStopBtn.addEventListener("click", () => {
  const values = routeInputs().map((input) => input.value);
  if (values.length >= MAX_STOPS) {
    toast("Maximum " + MAX_STOPS + " sites");
    return;
  }
  values.push("");
  renderRouteStops(values);
  const inputs = routeInputs();
  inputs[inputs.length - 1].focus();
});
routeStopsEl.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-remove]");
  if (!btn) return;
  const values = routeInputs().map((input) => input.value);
  if (values.length <= 2) return;
  values.splice(Number(btn.getAttribute("data-remove")), 1);
  renderRouteStops(values);
});
routeForm.addEventListener("submit", (event) => {
  event.preventDefault();
  calculateRoute();
});

function currentTheme() {
  try {
    return localStorage.getItem(THEME_KEY) || "midnight";
  } catch {
    return "midnight";
  }
}

function applyTheme(id) {
  const theme = THEMES.some((item) => item.id === id) ? id : "midnight";
  document.documentElement.setAttribute("data-theme", theme);
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
  }
  themeGrid.querySelectorAll(".theme-option").forEach((btn) => {
    btn.classList.toggle("active", btn.getAttribute("data-theme-id") === theme);
  });
}

function renderThemes() {
  themeGrid.innerHTML = THEMES.map(
    (theme) =>
      '<button type="button" class="theme-option" data-theme-id="' +
      theme.id +
      '"><span class="theme-dot"></span>' +
      theme.name +
      "</button>"
  ).join("");
  applyTheme(currentTheme());
}

function closeThemeSheet() {
  themeSheet.hidden = true;
}

themeBtn.addEventListener("click", () => {
  themeSheet.hidden = !themeSheet.hidden;
});
themeSheet.addEventListener("click", (event) => {
  if (event.target === themeSheet) closeThemeSheet();
});
themeGrid.addEventListener("click", (event) => {
  const option = event.target.closest("[data-theme-id]");
  if (!option) return;
  applyTheme(option.getAttribute("data-theme-id"));
  closeThemeSheet();
});

renderThemes();
renderRecent();

</script>
</body>
</html>
