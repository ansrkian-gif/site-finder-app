<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Site Finder" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Site Finder</title>
  <script>
    (function () {
      var theme = "midnight";
      try { theme = localStorage.getItem("site-finder-theme") || "midnight"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <path fill="currentColor" d="M16 2a10 10 0 0 0-10 10c0 7.5 10 18 10 18s10-10.5 10-18A10 10 0 0 0 16 2zm0 13.5A3.5 3.5 0 1 1 16 8a3.5 3.5 0 0 1 0 7.5z"/>
          </svg>
        </span>
        <div>
          <p class="eyebrow">Field lookup</p>
          <h1>Site Finder</h1>
        </div>
      </div>
      <div class="top-actions">
        <p class="count" id="siteCount"></p>
        <button type="button" class="theme-btn" id="themeBtn" aria-label="Change theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <form class="search-wrap" id="searchForm" autocomplete="off">
      <label class="sr-only" for="query">Search site ID</label>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          id="query"
          name="query"
          type="search"
          inputmode="text"
          enterkeyhint="search"
          placeholder="Search site ID"
          spellcheck="false"
          autocapitalize="characters"
          autocorrect="off"
        />
        <button type="button" class="clear" id="clearBtn" hidden aria-label="Clear search">×</button>
      </div>
    </form>

    <main id="main">
      <section class="home" id="homeState">
        <div class="hero-card">
          <div class="hero-pin" aria-hidden="true">
            <svg viewBox="0 0 80 80" width="72" height="72">
              <circle cx="40" cy="40" r="36" fill="currentColor" opacity="0.12"/>
              <path fill="currentColor" d="M40 14a16 16 0 0 0-16 16c0 12 16 30 16 30s16-18 16-30A16 16 0 0 0 40 14zm0 22a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/>
            </svg>
          </div>
          <h2>Find any site in seconds</h2>
          <p class="hint">Search by ID like <strong>4578</strong> or candidate ID like <strong>4578T</strong>. Then open maps or share on WhatsApp.</p>
          <div class="chips starter" id="starterChips">
            <button type="button" class="chip" data-q="4578">4578</button>
            <button type="button" class="chip" data-q="4581">4581</button>
            <button type="button" class="chip" data-q="5853">5853</button>
          </div>
        </div>
        <div id="recentWrap" hidden>
          <h3 class="list-label">Recent</h3>
          <div class="chips" id="recentList"></div>
        </div>
      </section>

      <section id="resultsState" hidden></section>
      <section id="detailState" hidden></section>
    </main>
  </div>

  <div class="theme-sheet" id="themeSheet" hidden>
    <div class="theme-sheet-inner">
      <h2>Choose a theme</h2>
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
